[project]
name = "ensemble-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "langgraph", "langgraph-checkpoint-sqlite",
  "pydantic>=2", "pyyaml", "sqlmodel", "openai",
  "fastapi", "uvicorn[standard]",
]

[project.scripts]
ensemble = "app.cli:main"

[project.optional-dependencies]
graph = ["graphiti-core>=0.5"]
observability = ["langsmith>=0.1.100"]

[dependency-groups]
dev = ["pytest", "pytest-cov", "httpx", "pytest-asyncio"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
